<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba del modelo en el celular</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    label { display: block; font-size: 13px; color: #aaa; margin-top: 10px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 4px; border-radius: 8px;
                    border: 1px solid #444; background: #222; color: #eee; font-size: 15px; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px;
             background: #2a7; color: #fff; font-size: 16px; font-weight: 600; }
    button:disabled { background: #555; }
    pre { background: #000; color: #9f9; padding: 10px; border-radius: 8px; font-size: 12px;
          white-space: pre-wrap; word-break: break-word; }
    canvas { max-width: 100%; border: 2px solid #333; border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Prueba del modelo en el celular</h2>

  <pre id="entorno"></pre>

  <label>Modelo (.onnx, en esta misma carpeta)
    <input id="modelo" value="best_640.onnx">
  </label>
  <label>Tamaño de entrada (debe coincidir con el que se exportó)
    <input id="tam" type="number" value="640">
  </label>
  <label>Backend
    <select id="backend">
      <option value="wasm">wasm (CPU, funciona siempre)</option>
      <option value="webgl">webgl (GPU)</option>
      <option value="webgpu">webgpu (GPU, necesita contexto seguro)</option>
    </select>
  </label>
  <label>Hilos de WASM (solo si el navegador lo permite)
    <input id="hilos" type="number" value="1" min="1">
  </label>
  <label>Confianza mínima
    <input id="conf" type="number" step="0.05" value="0.25">
  </label>
  <label>Imagen de prueba (opcional: un frame de la piscina)
    <input id="img" type="file" accept="image/*">
  </label>

  <button id="run">Medir</button>

  <pre id="log"></pre>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = (...a) => { $('log').textContent += a.join(' ') + '\n'; };

    $('entorno').textContent =
      `Contexto seguro: ${isSecureContext}\n` +
      `WebGPU disponible: ${!!navigator.gpu}\n` +
      `Multihilo (crossOriginIsolated): ${self.crossOriginIsolated}\n` +
      `Núcleos de CPU: ${navigator.hardwareConcurrency}`;

    // Prepara el tensor de entrada: la imagen "letterbox" a S x S, o gris con ruido si no hay imagen.
    async function prepararEntrada(S) {
      const canvas = $('canvas');
      canvas.width = canvas.height = S;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = 'rgb(114,114,114)';
      ctx.fillRect(0, 0, S, S);

      const file = $('img').files[0];
      if (file) {
        const bmp = await createImageBitmap(file);
        const r = Math.min(S / bmp.width, S / bmp.height);
        const w = Math.round(bmp.width * r), h = Math.round(bmp.height * r);
        ctx.drawImage(bmp, (S - w) / 2, (S - h) / 2, w, h);
      } else {
        const d = ctx.getImageData(0, 0, S, S);
        for (let i = 0; i < d.data.length; i += 4) d.data[i] = d.data[i + 1] = d.data[i + 2] = Math.random() * 255;
        ctx.putImageData(d, 0, 0);
      }

      const px = ctx.getImageData(0, 0, S, S).data;
      const data = new Float32Array(3 * S * S);
      for (let i = 0; i < S * S; i++) {
        data[i] = px[i * 4] / 255;                 // R
        data[S * S + i] = px[i * 4 + 1] / 255;     // G
        data[2 * S * S + i] = px[i * 4 + 2] / 255; // B
      }
      return { tensor: new ort.Tensor('float32', data, [1, 3, S, S]), ctx, usaImagen: !!file };
    }

    function iou(a, b) {
      const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
      const x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const ua = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter;
      return ua > 0 ? inter / ua : 0;
    }

    // Salida de YOLOv5: [1, N, 5 + nc] = cx, cy, w, h, obj, clases...
    function decodificar(out, conf) {
      const [, N, C] = out.dims;
      const nc = C - 5, d = out.data, cajas = [];
      for (let i = 0; i < N; i++) {
        const o = i * C, obj = d[o + 4];
        if (obj < conf) continue;
        let mejor = 0, sc = 0;
        for (let c = 0; c < nc; c++) if (d[o + 5 + c] > sc) { sc = d[o + 5 + c]; mejor = c; }
        const score = obj * sc;
        if (score < conf) continue;
        const [cx, cy, w, h] = [d[o], d[o + 1], d[o + 2], d[o + 3]];
        cajas.push([cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, score, mejor]);
      }
      cajas.sort((a, b) => b[4] - a[4]);
      const keep = [];
      for (const c of cajas) if (keep.every((k) => k[5] !== c[5] || iou(k, c) < 0.45)) keep.push(c);
      return keep;
    }

    const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.floor(arr.length * p))];

    async function medir() {
      $('log').textContent = '';
      $('run').disabled = true;
      try {
        const S = +$('tam').value, backend = $('backend').value, conf = +$('conf').value;
        ort.env.wasm.numThreads = +$('hilos').value;

        const t0 = performance.now();
        const session = await ort.InferenceSession.create($('modelo').value, { executionProviders: [backend] });
        log(`Backend: ${backend} | carga del modelo: ${(performance.now() - t0).toFixed(0)} ms`);

        const { tensor, ctx, usaImagen } = await prepararEntrada(S);
        const feeds = { [session.inputNames[0]]: tensor };

        for (let i = 0; i < 3; i++) await session.run(feeds); // calentamiento
        const tiempos = [];
        let salida;
        for (let i = 0; i < 30; i++) {
          const t = performance.now();
          salida = await session.run(feeds);
          tiempos.push(performance.now() - t);
        }
        tiempos.sort((a, b) => a - b);
        const media = tiempos.reduce((a, b) => a + b, 0) / tiempos.length;

        log(`Entrada ${S}x${S} | 30 corridas`);
        log(`Inferencia: media ${media.toFixed(0)} ms | mediana ${pct(tiempos, .5).toFixed(0)} ms | ` +
            `p95 ${pct(tiempos, .95).toFixed(0)} ms | min ${tiempos[0].toFixed(0)} | max ${tiempos[tiempos.length - 1].toFixed(0)}`);
        log(`FPS posibles: ${(1000 / media).toFixed(1)}`);

        const out = salida[session.outputNames[0]];
        log(`Forma de la salida: [${out.dims.join(', ')}]`);
        const cajas = decodificar(out, conf);
        log(usaImagen ? `Detecciones (conf >= ${conf}): ${cajas.length}` : 'Sin imagen: la entrada es ruido, no se esperan detecciones.');

        ctx.lineWidth = 2; ctx.font = '14px sans-serif';
        for (const [x1, y1, x2, y2, s, c] of cajas) {
          ctx.strokeStyle = c === 0 ? '#0f0' : '#f80';
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.fillText(`clase ${c} ${(s * 100).toFixed(0)}%`, x1 + 3, y1 + 14);
        }

        log('');
        log(media <= 200 ? 'OK: alcanza ~5 FPS o más (suficiente para medir cruces).' :
            'LENTO: menos de 5 FPS. Probá un tamaño menor o otro backend.');
      } catch (e) {
        log('ERROR:', e.message || e);
      } finally {
        $('run').disabled = false;
      }
    }

    $('run').addEventListener('click', medir);
  </script>
</body>
</html>
